const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
function idb(){return new Promise(r=>{try{const q=indexedDB.open('r6key',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})}
async function kget(){const db=await idb();if(!db)return null;return new Promise(r=>{try{const q=db.transaction('k').objectStore('k').get('k');q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})}
async function kput(v){const db=await idb();if(!db)return;try{const t=db.transaction('k','readwrite');v?t.objectStore('k').put(v,'k'):t.objectStore('k').delete('k')}catch(e){}}
async function open1(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.iv)},key,u(D.ct));const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close()}
async function derive(pw){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:u(D.salt),iterations:D.it},b,{name:'AES-GCM',length:256},false,['decrypt'])}
(async()=>{const s=await kget();if(s&&s.salt===D.salt){try{await open1(s.key);return}catch(e){}}
  document.getElementById('w').hidden=false;document.getElementById('p').focus()})();
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('m');m.textContent='Ouverture…';
  try{const k=await derive(document.getElementById('p').value);await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.iv)},k,u(D.ct));
    if(document.getElementById('r').checked)await kput({key:k,salt:D.salt});await open1(k)}catch(err){m.textContent='Mot de passe incorrect.'}};
